name: fuzzing
on: [push, pull_request, workflow_dispatch]
jobs:
  run-fuzzing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run fuzz tests
        run: make fuzz
