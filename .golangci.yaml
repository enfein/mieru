version: "2"
linters:
  default: none
  enable:
    - depguard
    - govet
    - misspell
  settings:
    depguard:
      rules:
        apis-common:
          files:
            - "**/apis/common/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/enfein/mieru/v3/apis/constant
            - github.com/enfein/mieru/v3/apis/model
        apis-client:
          files:
            - "**/apis/client/**"
          deny:
            - pkg: github.com/enfein/mieru/v3/pkg/appctl$
              desc: "apis/client should not depend on pkg/appctl"
            - pkg: github.com/enfein/mieru/v3/pkg/cli$
              desc: "apis/client should not depend on pkg/cli"
        apis-constant:
          files:
            - "**/apis/constant/**"
          allow:
            - $gostd
        apis-model:
          files:
            - "**/apis/model/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/enfein/mieru/v3/apis/constant
        apis-server:
          files:
            - "**/apis/server/**"
          deny:
            - pkg: github.com/enfein/mieru/v3/pkg/appctl$
              desc: "apis/server should not depend on pkg/appctl"
            - pkg: github.com/enfein/mieru/v3/pkg/cli$
              desc: "apis/server should not depend on pkg/cli"
        pkg-appctl-appctlcommon:
          files:
            - "**/pkg/appctl/appctlcommon/**"
          deny:
            - pkg: google.golang.org/grpc
              desc: "pkg/appctl/appctlcommon should not depend on grpc"
        pkg-deque:
          files:
            - "**/pkg/deque/**"
          allow:
            - $gostd
        pkg-log:
          files:
            - "**/pkg/log/**"
          allow:
            - $gostd
        pkg-mathext:
          files:
            - "**/pkg/mathext/**"
          allow:
            - $gostd
            - golang.org/x/sys/cpu
        pkg-stderror:
          files:
            - "**/pkg/stderror/**"
          allow:
            - $gostd
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
